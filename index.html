.banner::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26%;
background:linear-gradient(to bottom,rgba(14,26,51,0),var(--hero))}
.hero-in{max-width:880px;margin:0 auto;position:relative;z-index:2;text-align:center;padding:2px 20px 74px}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--hero-muted);margin-bottom:6px}
.hero-sub{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-size:clamp(20px,4vw,26px);color:var(--hero-ink)}
.pill{display:inline-block;margin-top:14px;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:6px 14px;font-size:13px}
.pill b{color:var(--gold)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* STEPPER */
.wrap{max-width:880px;margin:-40px auto 0;padding:0 16px 60px;position:relative;z-index:3}
.stepper{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:18px}
.st{flex:1;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:6px 5px;border-radius:9px;min-width:0}
.st i{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}
.st span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.on{color:var(--ink);font-weight:600;background:var(--gold-soft)}
.st.on i{background:var(--gold);border-color:var(--gold);color:#2B1B00}
.st.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.st.done{color:var(--ink)}
/* PANEL */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 22px}
.panel h2{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-size:26px;line-height:1.15}
.panel .lead{color:var(--muted);margin:6px 0 20px}
.back{background:none;border:0;color:var(--muted);font-size:14px;margin-bottom:12px;padding:4px 0}
.back:hover{color:var(--ink)}
.group{margin-top:18px}
.group h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
/* FUNCAO CARDS */
.grid-f{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.fcard{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;transition:.15s}
.fcard:hover{border-color:var(--gold);transform:translateY(-1px)}
.fcard b{display:block;font-size:16px}
.fcard small{color:var(--muted);font-size:13px}
.fcard.big{grid-column:1/-1;background:var(--hero);color:#fff;border-color:var(--hero);padding:20px}
.fcard.big b{font-size:22px;font-family:"Iowan Old Style",Georgia,serif}
.fcard.big small{color:var(--hero-muted)}
.fcard.big:hover{border-color:var(--gold)}
/* PHOTO CARDS */
.grid-p{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.pcard{background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:18px 10px 14px;text-align:center;transition:.15s}
.pcard:hover{border-color:var(--gold);transform:translateY(-2px)}
.av{width:104px;height:104px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;overflow:hidden;
color:#fff;font-weight:700;font-size:26px;letter-spacing:.02em;box-shadow:0 0 0 3px var(--surface),0 0 0 4.5px var(--line)}
.av img{width:100%;height:100%;object-fit:cover}
.pcard:hover .av{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--gold)}
.pcard b{display:block;font-size:15px;line-height:1.2}
.pcard small{display:block;margin-top:4px;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
/* PAGAMENTO */
.sum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{background:var(--gold-soft);color:var(--gold-ink);border-radius:999px;padding:6px 12px;font-size:13px}
.chip em{font-style:normal;opacity:.7;margin-right:5px}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media (max-width:700px){.two{grid-template-columns:1fr}.st span{display:none}.st{justify-content:center}}
.box{border:1px solid var(--line);border-radius:14px;padding:16px}
.box h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
td{padding:9px 0;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td:last-child{text-align:right;font-weight:700}
td small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.pix{font-size:20px;font-weight:700;letter-spacing:.01em;margin:4px 0 2px}
.bank{color:var(--muted);font-size:13.5px;margin-bottom:12px}
.btn{display:inline-block;background:var(--gold);color:#2B1B00;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14.5px}
.btn:hover{filter:brightness(1.05)}
.btn.wide{width:100%;padding:15px;font-size:16px;margin-top:18px}
.free{padding:14px;border-radius:12px;background:var(--gold-soft);color:var(--gold-ink);font-weight:600}
.note{margin-top:14px;font-size:13px;color:var(--muted)}
.preview{margin-top:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--muted);
background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;word-break:break-all}
.deadline{margin-top:14px;color:var(--ok);font-weight:600;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field > label{font-size:13.5px;font-weight:600}
.hint{color:var(--muted);font-size:12.5px}
.msg-erro{color:#D14343;font-size:12.5px;font-weight:600}
.msg-falha{background:#FDECEC;color:#8A1F1F;border-radius:10px;padding:12px 14px;margin-top:14px;font-size:14px;font-weight:600}
@media (prefers-color-scheme: dark){ .msg-falha{background:#3A1717;color:#FFB4B4} .msg-erro{color:#FF8A8A} }
.panel input[type=text],.panel input[type=tel],.panel input[type=date],.panel input[type=number],.panel textarea{
width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
.panel input[type=file]{font-size:14px;max-width:100%}
.panel textarea{resize:vertical}
.field.erro input,.field.erro textarea,.field.erro .opts{border-color:#D14343}
.field.erro .opts{border:1.5px solid #D14343;border-radius:12px;padding:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:10px 16px;font-size:14.5px;text-align:left}
.opt:hover{border-color:var(--gold)}
.opt[aria-pressed="true"]{background:var(--gold);color:#2B1B00;border-color:var(--gold);font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:700px){.row2{grid-template-columns:1fr}}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:400 !important}
.chk input{width:22px;height:22px;margin-top:1px;flex:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.btn[disabled]{opacity:.6;cursor:wait}
.okmark{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:34px;font-weight:700;margin-bottom:14px}
.vida{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-weight:700;font-size:clamp(26px,6vw,40px);line-height:1.1;margin:2px 0 14px;color:var(--ink)}
.lista{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 14px;font-size:14px}
.lista li::before{content:"✓ ";color:var(--ok);font-weight:700}
</style>
</head>
<body>
<header class="hero">
<div class="banner" role="img" aria-label="Encontro com Deus"></div>
<div class="hero-in">
<h1 class="sr" id="evento"></h1>
<div class="eyebrow" id="rede"></div>
<p class="hero-sub" id="datas"></p>
<span class="pill">Pagamento até <b id="prazo"></b></span>
</div>

/* LÍDERES E DISCIPULADORES (EXEMPLO) — edite pelo botão "Editar líderes e fotos" no fim da página.

- Edvan e Francieli

- Edvan e Francieli
Edvan e Francieli
- Edvan e Francieli

- Marcelo e Taise

const esc = t => t.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pessoa(txt){
const m = txt.match(/^(.*?)\s*\(\s*REDE\s+(.+?)\s*\)\s*$/i);
return m ? { valor: txt, nome: esc(m[1]), rede: 'Rede ' + esc(m[2]) } : { valor: txt, nome: esc(txt), rede: '' };

const out = []; let cur = null;
txt.split('\n').forEach(l => {
const t = l.trim(); if (!t) return;
if (t.startsWith('-')) { const n = t.replace(/^-\s*/, ''); if (cur && n) cur.discs.push(pessoa(n)); }

});

}

const state = { step: 1, funcao: null, lider: null, disc: null, dados: {}, arquivo: null, enviando: false };
const $ = s => document.querySelector(s);
const brl = n => n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const ETAPAS = ['Igreja', 'Função', 'Dados', 'Líder', 'Discipulador', 'Saúde', 'Pagamento'];

{ rot: 'Crédito 2x', n: 2, v: 290, texto: 'Crédito 2x · R$ 290,00 (2x de R$ 145,00)' },
{ rot: 'Crédito 3x', n: 3, v: 295, texto: 'Crédito 3x · R$ 295,00 (3x de R$ 98,33)' },
{ rot: 'Crédito 4x', n: 4, v: 300, texto: 'Crédito 4x · R$ 300,00 (4x de R$ 75,00)' }
];
const D = () => state.dados;
const ehCrianca = () => !!state.funcao && state.funcao.nome.indexOf('Criança') === 0;
const soDigitos = v => (v || '').replace(/\D/g, '');
function hojeLocal(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function mascara(v){
const d = soDigitos(v).slice(0, 11);
if (!d) return '';
if (d.length <= 2) return '(' + d;
if (d.length <= 6) return '(' + d.slice(0, 2) + ') ' + d.slice(2);
if (d.length <= 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
}
function iniciais(nome){ return nome.split(' e ').map(p => p.trim()[0]).join(' & '); }
function cor(nome){ let h = 0; for (const c of nome) h = (h * 31 + c.charCodeAt(0)) >>> 0; const [a,b] = CORES[h % CORES.length]; return `linear-gradient(140deg,${a},${b})`; }
function avatar(nome){
const foto = FOTOS[nome];
return foto
? `<div class="av"><img src="${foto}" alt="Foto de ${nome}"></div>`
: `<div class="av" style="background:${cor(nome)}" role="img" aria-label="Foto de ${nome}">${iniciais(nome)}</div>`;
}
function renderStepper(){
$('#stepper').innerHTML = ETAPAS.map((t, i) => {
const n = i + 1, cls = n === state.step ? 'on' : n < state.step ? 'done' : '';

}).join('');
}
/* ---------- ajudantes de formulário ---------- */
function campoHtml(id, rotulo, corpo, dica){
return `<div class="field" id="f-${id}"><label for="${id}">${rotulo}</label>${corpo}${dica ? `<small class="hint">${dica}</small>` : ''}<span class="msg-erro" hidden></span></div>`;
}
function inputHtml(id, tipo, extra){ return `<input id="${id}" type="${tipo}" value="${esc(D()[id] || '')}" ${extra || ''}>`; }
function areaHtml(id){ return `<textarea id="${id}" rows="2">${esc(D()[id] || '')}</textarea>`; }
function opcoesHtml(id, pares){
return `<div class="opts" id="${id}" role="group">${pares.map(([v, rot]) =>
`<button type="button" class="opt" data-v="${esc(v)}" aria-pressed="${D()[id] === v}">${rot}</button>`).join('')}</div>`;
}
const par = lista => lista.map(x => [x, x]);
function erroEm(id, msg){ const f = $('#f-' + id); if (!f) return; f.classList.add('erro'); const m = f.querySelector('.msg-erro'); m.textContent = msg; m.hidden = false; }
function limparErro(id){ const f = $('#f-' + id); if (!f) return; f.classList.remove('erro'); f.querySelector('.msg-erro').hidden = true; }
function validar(regras){
let primeiro = null;
regras.forEach(([id, fn]) => { const msg = fn(D()[id]); if (msg) { erroEm(id, msg); primeiro = primeiro || id; } });
if (primeiro) { const f = $('#f-' + primeiro); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
return !primeiro;
}
const obrig = m => v => (v && String(v).trim()) ? '' : (m || 'Campo obrigatório.');
const telOk = v => { const n = soDigitos(v).length; return n >= 10 && n <= 11 ? '' : 'Digite o telefone com DDD. Exemplo: (11) 91234-5678'; };
function dataOk(v){
if (!v) return 'Informe a data.';
const d = new Date(v + 'T00:00:00');
if (isNaN(d.getTime()) || v < '1900-01-01' || v > hojeLocal()) return 'Data inválida.';
return '';
}
function ligarCampos(){
document.querySelectorAll('#panel input[type=text], #panel input[type=tel], #panel input[type=date], #panel input[type=number], #panel textarea').forEach(el => {
el.addEventListener('input', () => {
if (el.dataset.tel) el.value = mascara(el.value);
D()[el.id] = el.value; limparErro(el.id);
});
});
document.querySelectorAll('#panel .opts').forEach(g => g.addEventListener('click', e => {
const b = e.target.closest('.opt'); if (!b) return;
D()[g.id] = b.dataset.v;
g.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
limparErro(g.id);
if (g.id === 'forma') atualizarValor();
}));
document.querySelectorAll('#panel input[type=checkbox]').forEach(el => el.addEventListener('change', () => { D()[el.id] = el.checked; limparErro('lgpd'); }));
}

/* Anexo: fotos são reduzidas (economiza espaço no Drive); PDFs até 3,5 MB */
function lerImagem(file){
return new Promise((ok, no) => {
const url = URL.createObjectURL(file), img = new Image();
img.onload = () => {
const k = Math.min(1, 1600 / Math.max(img.width, img.height));
const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
URL.revokeObjectURL(url);
ok({ mime: 'image/jpeg', base64: c.toDataURL('image/jpeg', 0.82).split(',')[1], nome: file.name.replace(/\.[^.]+$/, '') + '.jpg' });
};
img.onerror = () => no(new Error('Imagem inválida'));
img.src = url;
});
}
function lerPdf(file){
return new Promise((ok, no) => {
if (file.size > 3.5 * 1024 * 1024) return no(new Error('O PDF passa de 3,5 MB. Envie uma foto do comprovante.'));
const r = new FileReader();
r.onload = () => ok({ mime: 'application/pdf', base64: String(r.result).split(',')[1], nome: file.name });
r.onerror = () => no(new Error('Não foi possível ler o arquivo.'));
r.readAsDataURL(file);
});
}
async function lerArquivo(e){
const f = e.target.files[0]; if (!f) return;
limparErro('arquivo'); state.arquivo = null;
try {
state.arquivo = f.type === 'application/pdf' ? await lerPdf(f) : f.type.indexOf('image/') === 0 ? await lerImagem(f) : (() => { throw new Error('Envie uma foto ou um PDF.'); })();
$('#arqInfo').textContent = 'Arquivo anexado: ' + state.arquivo.nome;
} catch (err) { erroEm('arquivo', err.message); e.target.value = ''; }
}
async function enviar(){
if (state.enviando) return;
const regras = [];
if (state.funcao.fator !== 0) {
regras.push(['forma', obrig('Escolha a forma de pagamento.')]);
if (D().dataPg) regras.push(['dataPg', dataOk]);
}
if (!validar(regras)) return;
const d = D(), btn = $('#enviar');
state.enviando = true; btn.disabled = true; btn.textContent = 'Enviando…'; $('#falha').hidden = true;
const payload = {
igreja: 'Não', funcao: state.funcao.nome, ja: d.ja, nome: d.nome.trim(), nasc: d.nasc, sexo: d.sexo, tel: d.tel, transp: d.transp,
lider: state.lider.valor, disc: state.disc.valor, celula: d.celula.trim(), lc: '', alerg: d.alerg.trim(), med: d.med.trim(),
emNome: d.emNome.trim(), emTel: d.emTel, resp: (d.resp || '').trim(), lgpd: !!d.lgpd, forma: d.forma, valor: Number(d.valor) || 0,
dataPg: d.dataPg, arquivo: state.arquivo ? { nome: state.arquivo.nome, mime: state.arquivo.mime, base64: state.arquivo.base64 } : null,
site: ($('#site') || {}).value || ''
};
if (!CONFIG.apiUrl) { state.enviando = false; sucesso({ teste: true, quando: new Date().toLocaleString('pt-BR') }); return; }
try {
const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 60000);
const r = await fetch(CONFIG.apiUrl, { method: 'POST', body: JSON.stringify(payload), signal: ctl.signal });
clearTimeout(t);
const j = await r.json();
state.enviando = false;
if (j.ok) sucesso(j); else falhou(j.erro || 'Não foi possível enviar.');
} catch (err) {
state.enviando = false;
falhou('Não foi possível enviar agora. Confira a internet e tente de novo. Seus dados continuam preenchidos.');
}
}
function falhou(msg){
const b = $('#enviar'); b.disabled = false; b.textContent = 'Enviar inscrição';
const m = $('#falha'); m.textContent = msg; m.hidden = false;
m.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function sucesso(j){
state.step = 8; renderStepper();
const d = D(), f = state.funcao;
const linhas = [['Nome', d.nome.trim()], ['Função', f.rot || f.nome], ['Líder', state.lider.nome], ['Discipulador', state.disc.nome],
['Telefone', d.tel], ['Valor', f.fator === 0 ? 'Isento' : (Number(d.valor) > 0 ? brl(Number(d.valor)) : 'A pagar até ' + CONFIG.prazo)], ['Recebida em', j.quando || '']];
$('#panel').innerHTML = `
<div class="okmark" aria-hidden="true">✓</div>
<div class="vida">SUA VIDA NUNCA MAIS SERÁ A MESMA</div>
<h2>Inscrição recebida!</h2>
<p class="lead">${j.teste ? '<b>MODO DE TESTE:</b> nada foi enviado nem salvo.' : 'Guarde esta tela. Seu comprovante de inscrição será enviado para o WhatsApp que você cadastrou.'}</p>
<div class="box"><h3>Resumo</h3><table>${linhas.map(([a, b]) => `<tr><td>${a}</td><td>${esc(String(b))}</td></tr>`).join('')}</table></div>
${f.fator === 0 ? '' : `<p class="deadline">Se ainda não pagou, o prazo vai até ${CONFIG.prazo}.</p>`}`;
window.scrollTo({ top: document.querySelector('.wrap').offsetTop - 60, behavior: 'smooth' });
}
function copiar(txt, btn){
const orig = btn.textContent;
const ok = () => { btn.textContent = 'Copiado ✓'; setTimeout(() => btn.textContent = orig, 1800); };
const alt = () => { const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch(e){} t.remove(); ok(); };
if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(ok, alt); else alt();
}
function render(rolar = true){
renderStepper();
[null, passo1, passo2, passo3, passo4, passo5, passo6, passo7][state.step]();
if (rolar) window.scrollTo({ top: document.querySelector('.wrap').offsetTop - 60, behavior: 'smooth' });
}
$('#rede').textContent = CONFIG.rede;
$('#evento').textContent = CONFIG.evento;
$('#datas').textContent = CONFIG.datas;
$('#prazo').textContent = CONFIG.prazo;
render(false);
</script>
</body>
